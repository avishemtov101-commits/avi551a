name: Build APK
on:
  push:
    branches: [opengate]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGateAuto-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      # מפרסם את ה-APK בענף "apk" כדי שיהיה קישור הורדה ישיר
      - name: Publish APK to apk branch
        run: |
          mkdir out && cp app/build/outputs/apk/debug/app-debug.apk out/OpenGateAuto.apk
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add . && git commit -qm "APK build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
